<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Números</title>
    <link rel="stylesheet" href="./main.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Comparação de Números</h1>
        <form id="number-form">
            <div>
                <label for="number-a">Número A:</label>
                <input type="number" id="number-a" name="numberA" step="any" required>
            </div>
            <div>
                <label for="number-b">Número B:</label>
                <input type="number" id="number-b" name="numberB" step="any" required>
            </div>
            <button type="submit">Validar</button>
        </form>
        <div id="message" class="message" role="status" aria-live="polite"></div>
    </main>
</body>
</html>
