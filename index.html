<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Consulta</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h2>Comparação de Números</h2>
        <form id="numberForm">
            <div>
                <label for="numberA">Número A:</label>
                <input type="number" id="numberA" name="numberA" required>
            </div>
            <div>
                <label for="numberB">Número B:</label>
                <input type="number" id="numberB" name="numberB" required>
            </div>
            <button type="submit">Validar</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script src="/index.js"></script>
</body>
</html>
